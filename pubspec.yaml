name: mehendi_booking_app
description: "Mehendi/Henna booking & shop app - schedule henna appointments and buy henna cones online."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  firebase_messaging: ^14.9.4

  # State management
  provider: ^6.1.2

  # UI / UX
  table_calendar: ^3.1.2
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  image_picker: ^1.1.2

  # Utils
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  http: ^1.2.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  # Add an assets section here once you bundle local images/icons, e.g.:
  # assets:
  #   - assets/images/
